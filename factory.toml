# Configuración de factory. Solo lo que difiere de los valores por defecto de
# src/factory/config.py (documentados en docs/harness/loops.md).

[harness]
verify_command = "./scripts/check.sh"

[loop]
# Archivos existentes que ninguna ronda puede modificar, borrar ni renombrar (sí crear nuevos).
# Se suman a los críticos: feature_list.json, factory.toml, prompts/** y el script de verificación.
protected_paths = ["tests/**"]
